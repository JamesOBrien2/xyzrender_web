<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #ffffff; overflow: hidden; font-family: sans-serif; }

    #viewer-container {
      width: 100%;
      height: 370px;
      position: relative;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
    }

    #viewer { width: 100%; height: 100%; }

    #hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #999;
      pointer-events: none;
      white-space: nowrap;
      background: rgba(255,255,255,0.75);
      padding: 2px 8px;
      border-radius: 10px;
    }

    #error-msg {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #888;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="viewer-container">
    <div id="viewer"></div>
    <div id="hint">Drag to rotate &nbsp;·&nbsp; Scroll to zoom</div>
    <div id="error-msg">3D viewer unavailable</div>
  </div>

  <!-- Bundled locally — no CDN dependency -->
  <script src="./3Dmol-min.js"></script>
  <script>
    let viewer  = null;
    let lastXyz = null;

    // ── Streamlit postMessage protocol ───────────────────────────────
    // isStreamlitMessage: true is required on every outbound message.

    function sendReady() {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*"
      );
    }

    function sendHeight(h) {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: h }, "*"
      );
    }

    function sendView() {
      if (!viewer) return;
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:setComponentValue", value: viewer.getView() }, "*"
      );
    }

    // ── Viewer setup ─────────────────────────────────────────────────

    function initViewer() {
      viewer = $3Dmol.createViewer("viewer", { backgroundColor: "white" });
    }

    function loadXyz(xyzStr) {
      viewer.clear();
      viewer.addModel(xyzStr, "xyz");
      viewer.setStyle({}, { stick: { radius: 0.12 }, sphere: { scale: 0.25 } });
      viewer.zoomTo();
      viewer.render();
    }

    // ── Handle render events from Streamlit ──────────────────────────

    window.addEventListener("message", (e) => {
      if (!e.data.isStreamlitMessage || e.data.type !== "streamlit:render") return;

      // Always set height first — even if viewer init fails the frame is visible.
      sendHeight(390);

      try {
        const xyz = e.data.args.xyz_str;

        if (!viewer) initViewer();

        // Only reload when the molecule actually changes —
        // preserves the user's drag-rotation across Streamlit reruns.
        if (xyz !== lastXyz) {
          lastXyz = xyz;
          loadXyz(xyz);
        }
      } catch (err) {
        console.error("mol_viewer render error:", err);
        document.getElementById("error-msg").style.display = "flex";
        document.getElementById("hint").style.display = "none";
      }
    });

    // Capture orientation whenever the user stops dragging
    document.addEventListener("mouseup",   () => { if (viewer) sendView(); });
    document.addEventListener("touchend",  () => { if (viewer) sendView(); });

    // Signal ready — 3Dmol-min.js is already loaded (blocking script above)
    sendReady();
    sendHeight(390);  // set initial height immediately; render event will confirm it
  </script>
</body>
</html>
